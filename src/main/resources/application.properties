spring.application.name=bibliocrud


# Especifico la conexión a la base de datos.
# Los valores se leen de variables de entorno: ${VARIABLE:valor_por_defecto}.
# DB_PASSWORD no tiene valor por defecto para no guardar credenciales en el repositorio.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Especifico la configuración de hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Especifico el puerto en el que va a correr la app backend
server.port=8080

# Desactivo open-in-view: el acceso a datos ocurre solo dentro de la capa de servicio
spring.jpa.open-in-view=false
